<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Details | Md. Zahidul Islam Rabin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            charcoal: '#0b1220',
            surface: '#111b2e',
            panel: '#16233a',
            panel2: '#1c2d47',
            border: '#23324a',
            amber: '#fbbf24',
            amberDim: '#c49214',
            cream: '#e5eaf2',
            muted: '#a3b4cc',
            dimmed: '#6b7a90',
            green: '#34d399',
            blue: '#60a5fa',
            red: '#f87171',
            purple: '#a78bfa'
          },
          fontFamily: {
            serif: ['"DM Serif Display"', 'serif'],
            mono: ['"IBM Plex Mono"', 'monospace'],
            body: ['"Libre Baskerville"', 'serif']
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --charcoal: #0b1220;
      --surface: #111b2e;
      --panel: #16233a;
      --panel2: #1c2d47;
      --border: #23324a;
      --amber: #fbbf24;
      --cream: #e5eaf2;
      --muted: #a3b4cc;
      --dimmed: #6b7a90;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--charcoal);
      color: var(--cream);
      font-family: 'Libre Baskerville', serif;
      overflow-x: hidden;
    }

    /* ── NOISE TEXTURE ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: .5;
    }

    /* ── LAYOUT ── */
    .page-wrap { position: relative; z-index: 1; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }

    /* ── NAV BAR ── */
    .top-nav {
      border-bottom: 1px solid var(--border);
      padding: 1rem 0;
      background: rgba(11,18,32,.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .top-nav .inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .back-link { font-family: 'IBM Plex Mono', monospace; font-size: .65rem; color: var(--amber); text-decoration: none; letter-spacing: .12em; text-transform: uppercase; display: flex; align-items: center; gap: .4rem; transition: opacity .2s; }
    .back-link:hover { opacity: .7; }
    .nav-title { font-family: 'IBM Plex Mono', monospace; font-size: .65rem; color: var(--dimmed); letter-spacing: .1em; }

    /* ── CATEGORY TABS ── */
    .cat-tabs { display: flex; gap: .5rem; flex-wrap: wrap; padding: 2rem 0 0; }
    .cat-tab {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .65rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: .45rem 1rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      cursor: pointer;
      color: var(--dimmed);
      background: var(--panel);
      transition: all .2s;
    }
    .cat-tab:hover { border-color: var(--amber); color: var(--cream); }
    .cat-tab.active { border-color: var(--amber); color: var(--amber); background: rgba(251,191,36,.07); }

    /* ── PROJECT GRID ── */
    .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.25rem; padding: 1.5rem 0 3rem; }
    .proj-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5rem;
      cursor: pointer;
      transition: all .25s;
      position: relative;
      overflow: hidden;
    }
    .proj-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(251,191,36,.04) 0%, transparent 60%);
      opacity: 0;
      transition: opacity .25s;
    }
    .proj-card:hover { border-color: var(--amber); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,.4); }
    .proj-card:hover::after { opacity: 1; }
    .proj-tag { font-family: 'IBM Plex Mono', monospace; font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); margin-bottom: .6rem; }
    .proj-title { font-family: 'DM Serif Display', serif; font-size: 1.1rem; color: var(--cream); line-height: 1.3; margin-bottom: .6rem; }
    .proj-desc { font-size: .78rem; color: var(--muted); line-height: 1.6; margin-bottom: 1rem; }
    .proj-tools { display: flex; flex-wrap: wrap; gap: .3rem; }
    .proj-tool { font-family: 'IBM Plex Mono', monospace; font-size: .58rem; padding: .2rem .55rem; border: 1px solid var(--border); border-radius: 2px; color: var(--dimmed); background: var(--panel); }
    .proj-arrow { position: absolute; bottom: 1rem; right: 1.2rem; font-size: .75rem; color: var(--dimmed); transition: all .2s; }
    .proj-card:hover .proj-arrow { color: var(--amber); transform: translateX(3px); }

    /* ── DETAIL PANEL ── */
    .detail-panel { display: none; }
    .detail-panel.open { display: block; }
    .detail-header { padding: 2.5rem 0 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
    .detail-tag { font-family: 'IBM Plex Mono', monospace; font-size: .62rem; letter-spacing: .15em; text-transform: uppercase; color: var(--amber); background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.2); display: inline-block; padding: .3rem .75rem; border-radius: 3px; margin-bottom: 1rem; }
    .detail-title { font-family: 'DM Serif Display', serif; font-size: 2.4rem; color: var(--cream); line-height: 1.15; margin-bottom: .8rem; }
    .detail-desc { font-size: .88rem; color: var(--muted); line-height: 1.75; max-width: 680px; }

    /* ── KPI ROW ── */
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; padding: 1.5rem 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin: 1.5rem 0; }
    .kpi-item { }
    .kpi-label { font-family: 'IBM Plex Mono', monospace; font-size: .58rem; letter-spacing: .12em; text-transform: uppercase; color: var(--dimmed); margin-bottom: .35rem; }
    .kpi-value { font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: var(--cream); }

    /* ── CONTENT SECTIONS ── */
    .detail-body { display: grid; grid-template-columns: 1fr 340px; gap: 2.5rem; align-items: start; }
    @media(max-width: 860px) { .detail-body { grid-template-columns: 1fr; } }

    .section-block { margin-bottom: 2rem; }
    .section-title { font-family: 'DM Serif Display', serif; font-size: 1.1rem; color: var(--amber); margin-bottom: .75rem; }
    .section-text { font-size: .82rem; color: var(--muted); line-height: 1.8; }
    .insight-box { background: var(--panel); border-left: 3px solid var(--amber); padding: 1rem 1.25rem; border-radius: 0 4px 4px 0; font-size: .82rem; color: var(--cream); font-style: italic; line-height: 1.7; }

    /* ── CODE BLOCKS ── */
    .code-block {
      background: #0d1521;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin: 1rem 0;
    }
    .code-header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: .55rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .code-lang { font-family: 'IBM Plex Mono', monospace; font-size: .58rem; color: var(--amber); letter-spacing: .1em; text-transform: uppercase; }
    .code-desc { font-family: 'IBM Plex Mono', monospace; font-size: .58rem; color: var(--dimmed); }
    .code-body { padding: 1.1rem 1.25rem; overflow-x: auto; }
    .code-body pre { font-family: 'IBM Plex Mono', monospace; font-size: .75rem; line-height: 1.7; white-space: pre; }
    .tok-kw { color: #c792ea; }   /* keyword / function */
    .tok-fn { color: #82aaff; }   /* function names */
    .tok-str { color: #c3e88d; }  /* strings */
    .tok-num { color: #f78c6c; }  /* numbers */
    .tok-cmt { color: #546e7a; font-style: italic; }  /* comments */
    .tok-op { color: #89ddff; }   /* operators */
    .tok-id { color: #ffcb6b; }   /* identifiers */
    .tok-val { color: #80cbc4; }  /* values */

    /* ── TABLE ── */
    .data-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; margin: 1rem 0; }
    table { width: 100%; border-collapse: collapse; font-family: 'IBM Plex Mono', monospace; font-size: .7rem; }
    thead tr { background: var(--panel); border-bottom: 1px solid var(--border); }
    thead th { padding: .55rem .9rem; text-align: left; color: var(--amber); letter-spacing: .08em; font-weight: 500; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid rgba(35,50,74,.5); transition: background .15s; }
    tbody tr:hover { background: var(--panel); }
    tbody td { padding: .45rem .9rem; color: var(--muted); white-space: nowrap; }
    .td-pos { color: #34d399; }
    .td-neg { color: #f87171; }
    .td-neu { color: #60a5fa; }
    .td-hi { color: var(--cream); font-weight: 500; }

    /* ── SIDEBAR WIDGETS ── */
    .sidebar { space-y: 1.25rem; }
    .widget {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .widget-title { font-family: 'IBM Plex Mono', monospace; font-size: .6rem; color: var(--amber); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 1rem; }
    .tool-chip { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: .6rem; padding: .25rem .55rem; border: 1px solid var(--border); border-radius: 2px; color: var(--muted); background: var(--panel); margin: .2rem; }
    .bar-metric { margin-bottom: .9rem; }
    .bar-label { display: flex; justify-content: space-between; margin-bottom: .3rem; font-family: 'IBM Plex Mono', monospace; font-size: .62rem; color: var(--muted); }
    .bar-track { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--amber) 0%, #f59e0b 100%); transition: width 1.2s ease-out; }
    .bar-fill.green { background: linear-gradient(90deg, #34d399, #10b981); }
    .bar-fill.blue { background: linear-gradient(90deg, #60a5fa, #3b82f6); }
    .step-list { counter-reset: steps; }
    .step-item { display: flex; gap: .75rem; margin-bottom: .75rem; font-size: .78rem; color: var(--muted); line-height: 1.5; }
    .step-num { font-family: 'IBM Plex Mono', monospace; font-size: .6rem; color: var(--amber); background: rgba(251,191,36,.1); border: 1px solid rgba(251,191,36,.2); border-radius: 50%; width: 1.3rem; height: 1.3rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: .1rem; }
    .cta-btn { display: block; text-align: center; background: var(--amber); color: var(--charcoal); font-family: 'IBM Plex Mono', monospace; font-size: .65rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; padding: .85rem 1rem; border-radius: 4px; text-decoration: none; transition: all .2s; margin-top: .5rem; border: none; cursor: pointer; width: 100%; }
    .cta-btn:hover { background: #fff; }
    .cta-btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); margin-top: .5rem; }
    .cta-btn-outline:hover { border-color: var(--amber); color: var(--amber); background: transparent; }

    /* ── EXCEL MOCK DASHBOARD ── */
    .xl-dashboard {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin: 1rem 0;
    }
    .xl-topbar {
      background: #1d6f42;
      padding: .5rem 1rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .xl-dot { width: 10px; height: 10px; border-radius: 50%; }
    .xl-title-bar { font-family: 'IBM Plex Mono', monospace; font-size: .65rem; color: rgba(255,255,255,.8); }
    .xl-ribbon { background: #217346; padding: .3rem 1rem; display: flex; gap: 1.5rem; border-bottom: 1px solid rgba(0,0,0,.2); }
    .xl-ribbon span { font-family: 'IBM Plex Mono', monospace; font-size: .55rem; color: rgba(255,255,255,.7); cursor: pointer; padding: .15rem .3rem; border-radius: 2px; }
    .xl-ribbon span:hover { background: rgba(255,255,255,.1); color: #fff; }
    .xl-body { padding: 1rem; }
    .xl-kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; margin-bottom: 1rem; }
    .xl-kpi-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: .75rem; }
    .xl-kpi-card .lbl { font-family: 'IBM Plex Mono', monospace; font-size: .55rem; color: var(--dimmed); text-transform: uppercase; letter-spacing: .08em; margin-bottom: .25rem; }
    .xl-kpi-card .val { font-family: 'DM Serif Display', serif; font-size: 1.1rem; color: var(--cream); }
    .xl-kpi-card .chg { font-family: 'IBM Plex Mono', monospace; font-size: .55rem; margin-top: .15rem; }
    .xl-chart-area { display: grid; grid-template-columns: 2fr 1fr; gap: .75rem; }
    .xl-chart-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: .9rem; }
    .xl-chart-card .chart-title { font-family: 'IBM Plex Mono', monospace; font-size: .58rem; color: var(--muted); margin-bottom: .75rem; }
    .bar-chart { display: flex; align-items: flex-end; gap: .35rem; height: 80px; }
    .bar-col { flex: 1; background: rgba(251,191,36,.25); border-radius: 2px 2px 0 0; position: relative; transition: all .3s; cursor: pointer; }
    .bar-col:hover { background: rgba(251,191,36,.5); }
    .bar-col .tip { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--charcoal); border: 1px solid var(--border); padding: .2rem .4rem; font-family: 'IBM Plex Mono', monospace; font-size: .5rem; color: var(--cream); white-space: nowrap; border-radius: 2px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .bar-col:hover .tip { opacity: 1; }
    .bar-xlabels { display: flex; gap: .35rem; margin-top: .3rem; }
    .bar-xlbl { flex: 1; font-family: 'IBM Plex Mono', monospace; font-size: .48rem; color: var(--dimmed); text-align: center; }
    .donut-wrap { display: flex; align-items: center; gap: .75rem; }
    .donut-svg { flex-shrink: 0; }
    .donut-legend { font-family: 'IBM Plex Mono', monospace; font-size: .55rem; }
    .donut-legend-item { display: flex; align-items: center; gap: .3rem; margin-bottom: .35rem; color: var(--muted); }
    .donut-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* ── PBI MOCK ── */
    .pbi-shell {
      background: #252423;
      border: 1px solid #3b3a39;
      border-radius: 8px;
      overflow: hidden;
      margin: 1rem 0;
    }
    .pbi-topbar { background: #323130; padding: .4rem .9rem; display: flex; align-items: center; justify-content: space-between; }
    .pbi-logo { font-family: 'IBM Plex Mono', monospace; font-size: .6rem; color: #f2c811; display: flex; align-items: center; gap: .3rem; }
    .pbi-actions { display: flex; gap: .75rem; }
    .pbi-actions span { font-family: 'IBM Plex Mono', monospace; font-size: .55rem; color: #a19f9d; cursor: pointer; }
    .pbi-canvas { padding: 1rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; }
    .pbi-card { background: #1b1a19; border: 1px solid #3b3a39; border-radius: 4px; padding: .85rem; }
    .pbi-card-title { font-family: 'IBM Plex Mono', monospace; font-size: .55rem; color: #a19f9d; margin-bottom: .5rem; text-transform: uppercase; letter-spacing: .08em; }
    .pbi-big-num { font-family: 'DM Serif Display', serif; font-size: 1.5rem; color: #f2f1ef; margin-bottom: .2rem; }
    .pbi-trend { font-family: 'IBM Plex Mono', monospace; font-size: .55rem; }
    .pbi-full { grid-column: 1 / -1; }
    .pbi-half { grid-column: span 2; }
    .pbi-line-chart { width: 100%; height: 70px; }
    .pbi-slicer { background: #1b1a19; border: 1px solid #3b3a39; border-radius: 4px; padding: .7rem; margin-top: .75rem; }
    .pbi-slicer-title { font-family: 'IBM Plex Mono', monospace; font-size: .55rem; color: #a19f9d; margin-bottom: .5rem; }
    .pbi-slicer-btns { display: flex; gap: .4rem; flex-wrap: wrap; }
    .pbi-slicer-btn { font-family: 'IBM Plex Mono', monospace; font-size: .55rem; padding: .2rem .5rem; border: 1px solid #3b3a39; border-radius: 2px; cursor: pointer; transition: all .15s; background: #252423; color: #a19f9d; }
    .pbi-slicer-btn.on { background: #f2c811; color: #1b1a19; border-color: #f2c811; }
    .dax-block { background: #1e1e1e; border: 1px solid #333; border-radius: 6px; overflow: hidden; margin: 1rem 0; }
    .dax-header { background: #2d2d30; padding: .45rem .9rem; display: flex; justify-content: space-between; }
    .dax-lang { font-family: 'IBM Plex Mono', monospace; font-size: .58rem; color: #f2c811; letter-spacing: .08em; }
    .dax-body { padding: .9rem 1.1rem; }
    .dax-body pre { font-family: 'IBM Plex Mono', monospace; font-size: .72rem; line-height: 1.7; white-space: pre; color: #d4d4d4; }
    .dax-kw { color: #569cd6; }
    .dax-fn { color: #dcdcaa; }
    .dax-str { color: #ce9178; }
    .dax-cmt { color: #6a9955; font-style: italic; }
    .dax-num { color: #b5cea8; }

    /* ── QUERY RESULT BADGE ── */
    .result-badge { display: inline-flex; align-items: center; gap: .4rem; font-family: 'IBM Plex Mono', monospace; font-size: .6rem; background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.2); color: #34d399; padding: .25rem .6rem; border-radius: 3px; margin-bottom: .75rem; }

    /* ── PYTHON NOTEBOOK STYLE ── */
    .nb-cell { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin: .75rem 0; }
    .nb-cell-header { background: var(--panel); padding: .4rem .9rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .nb-in { font-family: 'IBM Plex Mono', monospace; font-size: .58rem; color: #60a5fa; }
    .nb-out { font-family: 'IBM Plex Mono', monospace; font-size: .58rem; color: #34d399; }
    .nb-body { padding: .9rem 1.1rem; background: #0d1521; }
    .nb-body pre { font-family: 'IBM Plex Mono', monospace; font-size: .72rem; line-height: 1.7; white-space: pre; color: #cdd6f4; }
    .nb-output { padding: .75rem 1.1rem; background: #0a0f1a; border-top: 1px solid var(--border); }
    .nb-output pre { font-family: 'IBM Plex Mono', monospace; font-size: .7rem; color: #a6e3a1; white-space: pre; }
    .py-kw { color: #cba6f7; }
    .py-fn { color: #89b4fa; }
    .py-str { color: #a6e3a1; }
    .py-num { color: #fab387; }
    .py-cmt { color: #585b70; font-style: italic; }
    .py-cls { color: #f9e2af; }
    .py-op { color: #89dceb; }

    /* ── WORKFLOW PIPELINE ── */
    .pipeline { display: flex; align-items: center; flex-wrap: wrap; gap: 0; margin: 1rem 0; }
    .pipe-step { background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: .5rem .85rem; font-family: 'IBM Plex Mono', monospace; font-size: .6rem; color: var(--muted); white-space: nowrap; }
    .pipe-arrow { font-size: .7rem; color: var(--dimmed); padding: 0 .35rem; }

    /* ── SCATTER MOCK ── */
    .scatter-container { position: relative; width: 100%; height: 160px; background: #0d1521; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .scatter-dot { position: absolute; border-radius: 50%; transition: all .3s; }

    /* ── TABS INSIDE DETAIL ── */
    .detail-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; flex-wrap: wrap; }
    .detail-tab { font-family: 'IBM Plex Mono', monospace; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; padding: .6rem 1.1rem; cursor: pointer; color: var(--dimmed); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .2s; }
    .detail-tab:hover { color: var(--muted); }
    .detail-tab.active { color: var(--amber); border-bottom-color: var(--amber); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── FORMULA CHIP ── */
    .formula-chip { display: inline-block; background: var(--panel2); border: 1px solid var(--border); border-radius: 3px; padding: .2rem .55rem; font-family: 'IBM Plex Mono', monospace; font-size: .68rem; color: #c3e88d; margin: .2rem; }

    /* ── BACK FROM DETAIL ── */

=<span class="tok-fn">Assumptions!C5</span> * (1 + <span class="tok-fn">Assumptions!C8</span>)

<span class="tok-cmt">// COGS as % of Revenue — dynamic to growth stage</span>
=<span class="tok-fn">IS!B8</span> * <span class="tok-fn">VLOOKUP</span>(<span class="tok-fn">IS!B3</span>, <span class="tok-fn">CostTable</span>, 2, <span class="tok-kw">TRUE</span>)

<span class="tok-cmt">// DCF Terminal Value (Gordon Growth Model)</span>
=<span class="tok-fn">FCF_FY27</span> * (1 + <span class="tok-fn">Assumptions!LTG</span>) / (<span class="tok-fn">WACC</span> - <span class="tok-fn">Assumptions!LTG</span>)

<span class="tok-cmt">// WACC calculation (Ke * We + Kd * Wd * (1-T))</span>
=(<span class="tok-fn">Assumptions!CoE</span> * <span class="tok-fn">Assumptions!EquityWeight</span>) +
 (<span class="tok-fn">Assumptions!CoD</span> * <span class="tok-fn">Assumptions!DebtWeight</span> * (1 - <span class="tok-fn">Assumptions!TaxRate</span>))

<span class="tok-cmt">// Cash Flow from Operations (indirect method)</span>
=<span class="tok-fn">IS!NetIncome</span> + <span class="tok-fn">IS!DA</span> - <span class="tok-fn">DELTA_WorkingCapital</span>

<span class="tok-cmt">// Scenario toggle — Base/Bull/Bear switch</span>
=<span class="tok-fn">CHOOSE</span>(<span class="tok-fn">Dashboard!ScenarioToggle</span>,
    <span class="tok-fn">BaseRevenue</span>, <span class="tok-fn">BullRevenue</span>, <span class="tok-fn">BearRevenue</span>)

<span class="tok-cmt">// Runway calculation under stress test</span>
=<span class="tok-fn">MATCH</span>(<span class="tok-kw">TRUE</span>, <span class="tok-fn">MMULT</span>(<span class="tok-fn">CashBalance</span><span class="tok-op">&lt;</span>0, {1}), 0)</pre></div>

          <div class="tab-content" id="pt2">
            <div class="section-text" style="margin-bottom:1rem;">All KPI values in the dashboard are driven by DAX measures — enabling dynamic filtering and cross-visual interactions without pre-aggregating data.</div>

              <div class="dax-body"><pre><span class="dax-cmt">-- Total Revenue (with filter context)</span>
<span class="dax-fn">Total Revenue</span> <span class="dax-kw">=</span>
    <span class="dax-fn">SUMX</span>(
        <span class="dax-fn">FILTER</span>(Sales, Sales[Status] <span class="dax-kw">=</span> <span class="dax-str">"Won"</span>),
        Sales[Deal_Value_USD]
    )

<span class="dax-cmt">-- YoY Revenue Growth %</span>
<span class="dax-fn">Revenue YoY %</span> <span class="dax-kw">=</span>
    <span class="dax-kw">VAR</span> CurrentPeriod <span class="dax-kw">=</span> [Total Revenue]
    <span class="dax-kw">VAR</span> PriorPeriod <span class="dax-kw">=</span>
        <span class="dax-fn">CALCULATE</span>([Total Revenue],
            <span class="dax-fn">DATEADD</span>(DateTable[Date], <span class="dax-num">-1</span>, YEAR))
    <span class="dax-kw">RETURN</span>
        <span class="dax-fn">DIVIDE</span>(CurrentPeriod - PriorPeriod, PriorPeriod, <span class="dax-fn">BLANK</span>())

<span class="dax-cmt">-- Quota Attainment Rate</span>
<span class="dax-fn">Quota Attainment %</span> <span class="dax-kw">=</span>
    <span class="dax-fn">DIVIDE</span>(
        [Total Revenue],
        <span class="dax-fn">SUM</span>(Targets[Annual_Quota]),
        <span class="dax-num">0</span>
    )

<span class="dax-cmt">-- Rolling 3-Month Average (for trend smoothing)</span>
<span class="dax-fn">Revenue 3M Rolling Avg</span> <span class="dax-kw">=</span>
    <span class="dax-fn">AVERAGEX</span>(
        <span class="dax-fn">DATESINPERIOD</span>(DateTable[Date],
            <span class="dax-fn">LASTDATE</span>(DateTable[Date]), <span class="dax-num">-3</span>, MONTH),

    )

<span class="dax-cmt">-- Win Rate</span>
<span class="dax-fn">Win Rate</span> <span class="dax-kw">=</span>

        <span class="dax-fn">COUNTROWS</span>(<span class="dax-fn">FILTER</span>(Sales, Sales[Status] <span class="dax-kw">=</span> <span class="dax-str">"Won"</span>)),
        <span class="dax-fn">COUNTROWS</span>(<span class="dax-fn">FILTER</span>(Sales, Sales[Status] <span class="dax-kw">IN</span> {<span class="dax-str">"Won"</span>, <span class="dax-str">"Lost"</span>})),

            <div class="section-text" style="margin-bottom:1rem;">The model follows a star schema — one central fact table surrounded by dimension tables — ensuring optimal DAX performance and clean relationships without circular dependencies.</div>

                  <div>
                    <div style="color:var(--amber);margin-bottom:.5rem;">📊 FACT_Sales (Central)</div>
                    <div style="color:var(--muted);padding-left:.75rem;">
                      <div>🔑 SaleID (PK)</div>
                      <div>🔗 DateKey (FK → Dim_Date)</div>
                      <div>🔗 RepID (FK → Dim_Rep)</div>
                      <div>🔗 ProductID (FK → Dim_Product)</div>

                    </div>
                  </div>
                  <div>
                    <div style="color:#60a5fa;margin-bottom:.5rem;">📅 Dim_Date</div>
                    <div style="color:var(--muted);padding-left:.75rem;margin-bottom:.75rem;">DateKey, Date, Year, Quarter, Month, Week, IsWorkingDay</div>
                    <div style="color:#34d399;margin-bottom:.3rem;">👤 Dim_Rep</div>

  /* ─────────────── SQL 01 ─────────────── */
  {
    id: 'sql-01', cat: 'sql', tag: 'SQL · Customer Analytics',
    title: 'Customer Retention Cohort Analysis',
    shortDesc: 'Window function-driven cohort analysis across 24 months of transaction data — tracking monthly retention rates, identifying churn inflection points, and segmenting high-value customer groups.',
    tools: ['PostgreSQL', 'CTEs', 'Window Functions', 'DATE_TRUNC', 'CASE WHEN'],
    buildDetail: () => `
      <div class="detail-header fade-in">
        <div class="detail-tag">SQL · Customer Analytics</div>
        <h1 class="detail-title">Customer Retention Cohort Analysis</h1>
        <p class="detail-desc">A window function-driven SQL analysis across 24 months of transaction data — calculating monthly cohort retention rates, mapping churn inflection points, and surfacing high-value customer segments for targeted re-engagement.</p>
      </div>
      <div class="kpi-row fade-in">
        <div class="kpi-item"><div class="kpi-label">Customers Analyzed</div><div class="kpi-value">124,832</div></div>
        <div class="kpi-item"><div class="kpi-label">Cohorts Tracked</div><div class="kpi-value">24 Mo.</div></div>
        <div class="kpi-item"><div class="kpi-label">Month-1 Retention</div><div class="kpi-value">68.4%</div></div>
        <div class="kpi-item"><div class="kpi-label">Churn Point Found</div><div class="kpi-value">Month 3</div></div>
      </div>
      <div class="detail-body fade-in">
        <div>
          <div class="detail-tabs">
            <div class="detail-tab active" onclick="switchTab(this,'stab','st1')">Business Problem</div>
            <div class="detail-tab" onclick="switchTab(this,'stab','st2')">SQL Query</div>
            <div class="detail-tab" onclick="switchTab(this,'stab','st3')">Results</div>
            <div class="detail-tab" onclick="switchTab(this,'stab','st4')">Schema</div>
          </div>
          <div class="tab-content active" id="st1">
            <div class="section-block">
              <div class="section-title">Business Problem</div>
              <div class="section-text">The growth team knew overall monthly churn was ~7% but had no visibility into when customers were most likely to churn, which acquisition cohorts performed better, or which product tiers retained at higher rates. Standard BI dashboards couldn't answer cohort-level questions without pre-built data transformations.</div>
            </div>
            <div class="section-block">
              <div class="section-title">Objective</div>
              <div class="section-text">Build a reusable SQL query that (1) assigns each customer to their first-purchase cohort month, (2) calculates month-over-month retention for each cohort, and (3) outputs a pivot-ready retention matrix that can feed directly into a Power BI heatmap.</div>
            </div>
            <div class="section-block">
              <div class="section-title">Database Schema</div>
              <div class="pipeline">
                <div class="pipe-step">customers</div><div class="pipe-arrow">→</div>
                <div class="pipe-step">orders</div><div class="pipe-arrow">→</div>
                <div class="pipe-step">order_items</div><div class="pipe-arrow">→</div>
                <div class="pipe-step">products</div>
              </div>
            </div>
          </div>
          <div class="tab-content" id="st2">
            <div class="result-badge">✓ Query Executed — 124,832 rows processed in 1.2s</div>
            <div class="code-block">
              <div class="code-header"><span class="code-lang">PostgreSQL</span><span class="code-desc">Cohort Retention Analysis</span></div>
              <div class="code-body"><pre><span class="tok-cmt">-- ============================================================
-- Customer Cohort Retention Analysis
-- Author: Md. Zahidul Islam Rabin
-- Purpose: Calculate monthly retention rate by acquisition cohort
-- ============================================================</span>

<span class="tok-kw">WITH</span> <span class="tok-id">first_purchase</span> <span class="tok-kw">AS</span> (
    <span class="tok-cmt">-- Step 1: Find each customer's cohort (first purchase month)</span>
    <span class="tok-kw">SELECT</span>
        customer_id,
        <span class="tok-fn">DATE_TRUNC</span>(<span class="tok-str">'month'</span>, <span class="tok-fn">MIN</span>(order_date)) <span class="tok-kw">AS</span> cohort_month
    <span class="tok-kw">FROM</span> orders
    <span class="tok-kw">WHERE</span> status <span class="tok-op">!=</span> <span class="tok-str">'cancelled'</span>
    <span class="tok-kw">GROUP BY</span> customer_id
),

<span class="tok-id">order_activity</span> <span class="tok-kw">AS</span> (
    <span class="tok-cmt">-- Step 2: Calculate months since cohort for each order</span>
    <span class="tok-kw">SELECT</span>
        o.customer_id,
        fp.cohort_month,
        <span class="tok-fn">DATE_TRUNC</span>(<span class="tok-str">'month'</span>, o.order_date) <span class="tok-kw">AS</span> order_month,
        <span class="tok-fn">EXTRACT</span>(<span class="tok-kw">YEAR</span> <span class="tok-kw">FROM</span> <span class="tok-fn">AGE</span>(
            <span class="tok-fn">DATE_TRUNC</span>(<span class="tok-str">'month'</span>, o.order_date),
            fp.cohort_month
        )) <span class="tok-op">*</span> <span class="tok-num">12</span> <span class="tok-op">+</span>
        <span class="tok-fn">EXTRACT</span>(<span class="tok-kw">MONTH</span> <span class="tok-kw">FROM</span> <span class="tok-fn">AGE</span>(
            <span class="tok-fn">DATE_TRUNC</span>(<span class="tok-str">'month'</span>, o.order_date),
            fp.cohort_month
        )) <span class="tok-kw">AS</span> month_number
    <span class="tok-kw">FROM</span> orders o
    <span class="tok-kw">INNER JOIN</span> first_purchase fp <span class="tok-kw">ON</span> o.customer_id <span class="tok-op">=</span> fp.customer_id
    <span class="tok-kw">WHERE</span> o.status <span class="tok-op">!=</span> <span class="tok-str">'cancelled'</span>
),

<span class="tok-id">cohort_sizes</span> <span class="tok-kw">AS</span> (
    <span class="tok-cmt">-- Step 3: Count cohort size (customers in month 0)</span>
    <span class="tok-kw">SELECT</span>
        cohort_month,
        <span class="tok-fn">COUNT</span>(<span class="tok-kw">DISTINCT</span> customer_id) <span class="tok-kw">AS</span> cohort_size
    <span class="tok-kw">FROM</span> order_activity
    <span class="tok-kw">WHERE</span> month_number <span class="tok-op">=</span> <span class="tok-num">0</span>
    <span class="tok-kw">GROUP BY</span> cohort_month
),

<span class="tok-id">cohort_retention</span> <span class="tok-kw">AS</span> (
    <span class="tok-cmt">-- Step 4: Count retained customers per cohort per month</span>
    <span class="tok-kw">SELECT</span>
        cohort_month,
        month_number,
        <span class="tok-fn">COUNT</span>(<span class="tok-kw">DISTINCT</span> customer_id) <span class="tok-kw">AS</span> retained_customers
    <span class="tok-kw">FROM</span> order_activity
    <span class="tok-kw">GROUP BY</span> cohort_month, month_number
)

<span class="tok-cmt">-- Final Output: Retention rate matrix</span>
<span class="tok-kw">SELECT</span>
    cr.cohort_month,
    cs.cohort_size,
    cr.month_number,
    cr.retained_customers,
    <span class="tok-fn">ROUND</span>(
        cr.retained_customers::NUMERIC / cs.cohort_size <span class="tok-op">*</span> <span class="tok-num">100</span>, <span class="tok-num">1</span>
    ) <span class="tok-kw">AS</span> retention_rate_pct,
    <span class="tok-kw">CASE</span>
        <span class="tok-kw">WHEN</span> cr.month_number <span class="tok-op">=</span> <span class="tok-num">0</span> <span class="tok-kw">THEN</span> <span class="tok-str">'Acquisition'</span>
        <span class="tok-kw">WHEN</span> cr.month_number <span class="tok-op">BETWEEN</span> <span class="tok-num">1</span> <span class="tok-kw">AND</span> <span class="tok-num">3</span> <span class="tok-kw">THEN</span> <span class="tok-str">'Early Retention'</span>
        <span class="tok-kw">WHEN</span> cr.month_number <span class="tok-op">BETWEEN</span> <span class="tok-num">4</span> <span class="tok-kw">AND</span> <span class="tok-num">12</span> <span class="tok-kw">THEN</span> <span class="tok-str">'Mid-Term'</span>
        <span class="tok-kw">ELSE</span> <span class="tok-str">'Loyal'</span>
    <span class="tok-kw">END</span> <span class="tok-kw">AS</span> lifecycle_stage
<span class="tok-kw">FROM</span> cohort_retention cr
<span class="tok-kw">INNER JOIN</span> cohort_sizes cs <span class="tok-kw">ON</span> cr.cohort_month <span class="tok-op">=</span> cs.cohort_month
<span class="tok-kw">ORDER BY</span> cr.cohort_month, cr.month_number;</pre></div>
            </div>
          </div>
          <div class="tab-content" id="st3">
            <div class="result-badge">✓ Output — Cohort Retention Rate Matrix (%)</div>
            <div class="data-table-wrap">
              <table>
                <thead><tr><th>Cohort</th><th>Size</th><th>M+0</th><th>M+1</th><th>M+2</th><th>M+3</th><th>M+6</th><th>M+12</th></tr></thead>
                <tbody>
                  <tr><td class="td-hi">Jan 2023</td><td>5,842</td><td class="td-pos">100%</td><td>68.4%</td><td>52.1%</td><td class="td-neg">38.2%</td><td>28.1%</td><td>19.4%</td></tr>
                  <tr><td class="td-hi">Feb 2023</td><td>4,921</td><td class="td-pos">100%</td><td>70.2%</td><td>54.8%</td><td>39.6%</td><td>29.3%</td><td>21.0%</td></tr>
                  <tr><td class="td-hi">Mar 2023</td><td>6,103</td><td class="td-pos">100%</td><td>71.8%</td><td>56.2%</td><td>41.0%</td><td>31.2%</td><td>22.8%</td></tr>
                  <tr><td class="td-hi">Jun 2023</td><td>5,412</td><td class="td-pos">100%</td><td>74.1%</td><td>59.3%</td><td>43.8%</td><td>33.4%</td><td>—</td></tr>
                  <tr><td class="td-hi">Sep 2023</td><td>7,218</td><td class="td-pos">100%</td><td>76.4%</td><td>61.7%</td><td>46.2%</td><td>—</td><td>—</td></tr>
                  <tr><td class="td-hi">Dec 2023</td><td>8,941</td><td class="td-pos">100%</td><td>78.2%</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>
                </tbody>
              </table>
            </div>
            <div class="insight-box" style="margin-top:1rem;">"Month 3 is the critical churn inflection point — where average retention drops from 55% to 39%. Customers who survive past Month 3 retain at nearly double the rate thereafter. This finding drove a new onboarding email sequence at Day 60."</div>
          </div>
          <div class="tab-content" id="st4">
            <div class="code-block">
              <div class="code-header"><span class="code-lang">SQL — Schema</span><span class="code-desc">Database Structure</span></div>
              <div class="code-body"><pre><span class="tok-kw">CREATE TABLE</span> customers (
    customer_id   <span class="tok-fn">SERIAL</span> <span class="tok-kw">PRIMARY KEY</span>,
    email         <span class="tok-id">VARCHAR</span>(<span class="tok-num">255</span>) <span class="tok-kw">UNIQUE NOT NULL</span>,

          <div class="tab-content active" id="s2t1">
            <div class="result-badge">✓ Stored Procedure — sp_ProductRevenueAnalysis</div>
            <div class="code-block">
              <div class="code-header"><span class="code-lang">SQL Server T-SQL</span><span class="code-desc">Product Revenue Ranking with Window Functions</span></div>
              <div class="code-body"><pre><span class="tok-kw">WITH</span> <span class="tok-id">product_revenue</span> <span class="tok-kw">AS</span> (
    <span class="tok-cmt">-- Aggregate revenue per product with YoY comparison</span>
    <span class="tok-kw">SELECT</span>
        p.product_id,
        p.product_name,
        p.category,
        p.unit_price,
        <span class="tok-fn">SUM</span>(oi.quantity <span class="tok-op">*</span> oi.unit_price) <span class="tok-kw">AS</span> revenue_ytd,
        <span class="tok-fn">SUM</span>(<span class="tok-kw">CASE WHEN</span> <span class="tok-fn">YEAR</span>(o.order_date) <span class="tok-op">=</span> <span class="tok-fn">YEAR</span>(<span class="tok-fn">GETDATE</span>())<span class="tok-op">-</span><span class="tok-num">1</span>
                 <span class="tok-kw">THEN</span> oi.quantity <span class="tok-op">*</span> oi.unit_price <span class="tok-kw">ELSE</span> <span class="tok-num">0</span> <span class="tok-kw">END</span>) <span class="tok-kw">AS</span> revenue_py,
        <span class="tok-fn">COUNT</span>(<span class="tok-kw">DISTINCT</span> o.order_id) <span class="tok-kw">AS</span> total_orders,
        <span class="tok-fn">COUNT</span>(<span class="tok-kw">DISTINCT</span> o.customer_id) <span class="tok-kw">AS</span> unique_customers
    <span class="tok-kw">FROM</span> order_items oi
    <span class="tok-kw">INNER JOIN</span> orders o     <span class="tok-kw">ON</span> oi.order_id   <span class="tok-op">=</span> o.order_id
    <span class="tok-kw">INNER JOIN</span> products p   <span class="tok-kw">ON</span> oi.product_id <span class="tok-op">=</span> p.product_id
    <span class="tok-kw">WHERE</span> o.status <span class="tok-op">=</span> <span class="tok-str">'Completed'</span>
      <span class="tok-kw">AND</span> <span class="tok-fn">YEAR</span>(o.order_date) <span class="tok-op">&gt;=</span> <span class="tok-fn">YEAR</span>(<span class="tok-fn">GETDATE</span>())<span class="tok-op">-</span><span class="tok-num">1</span>
    <span class="tok-kw">GROUP BY</span> p.product_id, p.product_name, p.category, p.unit_price
),
<span class="tok-id">ranked_products</span> <span class="tok-kw">AS</span> (
    <span class="tok-kw">SELECT</span>
        <span class="tok-op">*</span>,
        <span class="tok-fn">RANK</span>() <span class="tok-kw">OVER</span> (<span class="tok-kw">ORDER BY</span> revenue_ytd <span class="tok-kw">DESC</span>) <span class="tok-kw">AS</span> revenue_rank,
        <span class="tok-fn">RANK</span>() <span class="tok-kw">OVER</span> (<span class="tok-kw">PARTITION BY</span> category <span class="tok-kw">ORDER BY</span> revenue_ytd <span class="tok-kw">DESC</span>) <span class="tok-kw">AS</span> category_rank,
        <span class="tok-fn">SUM</span>(revenue_ytd) <span class="tok-kw">OVER</span> (<span class="tok-kw">ORDER BY</span> revenue_ytd <span class="tok-kw">DESC</span>
                              <span class="tok-kw">ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</span>)
                              <span class="tok-kw">AS</span> running_total,
        <span class="tok-fn">SUM</span>(revenue_ytd) <span class="tok-kw">OVER</span>() <span class="tok-kw">AS</span> grand_total,
        (revenue_ytd <span class="tok-op">-</span> revenue_py) <span class="tok-op">/</span> <span class="tok-fn">NULLIF</span>(revenue_py,<span class="tok-num">0</span>) <span class="tok-op">*</span> <span class="tok-num">100</span> <span class="tok-kw">AS</span> yoy_growth_pct
    <span class="tok-kw">FROM</span> product_revenue
)
<span class="tok-kw">SELECT</span>
    revenue_rank,
    product_name,
    category,
    revenue_ytd,
    <span class="tok-fn">ROUND</span>(running_total <span class="tok-op">/</span> grand_total <span class="tok-op">*</span> <span class="tok-num">100</span>, <span class="tok-num">1</span>) <span class="tok-kw">AS</span> cumulative_pct,
    yoy_growth_pct,
    total_orders,
    unique_customers,
    <span class="tok-kw">CASE WHEN</span> yoy_growth_pct <span class="tok-op">&lt;</span> <span class="tok-op">-</span><span class="tok-num">15</span> <span class="tok-kw">THEN</span> <span class="tok-str">'⚠ Flag for Review'</span>
         <span class="tok-kw">WHEN</span> yoy_growth_pct <span class="tok-op">&gt;</span> <span class="tok-num">20</span>  <span class="tok-kw">THEN</span> <span class="tok-str">'★ Top Performer'</span>
         <span class="tok-kw">ELSE</span> <span class="tok-str">'Stable'</span>
    <span class="tok-kw">END</span> <span class="tok-kw">AS</span> performance_flag
<span class="tok-kw">FROM</span> ranked_products
<span class="tok-kw">ORDER BY</span> revenue_rank;</pre></div>
            </div>

          <div class="tab-content" id="s2t2">
            <div class="code-block">
              <div class="code-header"><span class="code-lang">SQL Server T-SQL</span><span class="code-desc">Pareto — Top 20% Customers by Revenue</span></div>
              <div class="code-body"><pre><span class="tok-kw">WITH</span> <span class="tok-id">customer_revenue</span> <span class="tok-kw">AS</span> (
    <span class="tok-kw">SELECT</span>
        c.customer_id,
        c.customer_name,
        c.segment,
        <span class="tok-fn">SUM</span>(o.total_amount) <span class="tok-kw">AS</span> total_revenue,
        <span class="tok-fn">COUNT</span>(o.order_id)   <span class="tok-kw">AS</span> order_count,
        <span class="tok-fn">MAX</span>(o.order_date)   <span class="tok-kw">AS</span> last_order_date
    <span class="tok-kw">FROM</span> customers c
    <span class="tok-kw">INNER JOIN</span> orders o <span class="tok-kw">ON</span> c.customer_id <span class="tok-op">=</span> o.customer_id
    <span class="tok-kw">WHERE</span> o.status <span class="tok-op">=</span> <span class="tok-str">'Completed'</span>
    <span class="tok-kw">GROUP BY</span> c.customer_id, c.customer_name, c.segment
),
<span class="tok-id">pareto</span> <span class="tok-kw">AS</span> (
    <span class="tok-kw">SELECT</span> <span class="tok-op">*</span>,
        <span class="tok-fn">NTILE</span>(<span class="tok-num">5</span>) <span class="tok-kw">OVER</span> (<span class="tok-kw">ORDER BY</span> total_revenue <span class="tok-kw">DESC</span>) <span class="tok-kw">AS</span> revenue_quintile,
        <span class="tok-fn">SUM</span>(total_revenue) <span class="tok-kw">OVER</span>(<span class="tok-kw">ORDER BY</span> total_revenue <span class="tok-kw">DESC</span>
            <span class="tok-kw">ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</span>) <span class="tok-kw">AS</span> running_rev,
        <span class="tok-fn">SUM</span>(total_revenue) <span class="tok-kw">OVER</span>() <span class="tok-kw">AS</span> total_rev
    <span class="tok-kw">FROM</span> customer_revenue
)
<span class="tok-kw">SELECT</span>
    revenue_quintile,
    <span class="tok-fn">COUNT</span>(<span class="tok-op">*</span>)                             <span class="tok-kw">AS</span> customer_count,
    <span class="tok-fn">SUM</span>(total_revenue)                    <span class="tok-kw">AS</span> quintile_revenue,
    <span class="tok-fn">ROUND</span>(<span class="tok-fn">SUM</span>(total_revenue)<span class="tok-op">/</span><span class="tok-fn">MAX</span>(total_rev)<span class="tok-op">*</span><span class="tok-num">100</span>,<span class="tok-num">1</span>) <span class="tok-kw">AS</span> revenue_share_pct
<span class="tok-kw">FROM</span> pareto
<span class="tok-kw">GROUP BY</span> revenue_quintile
<span class="tok-kw">ORDER BY</span> revenue_quintile;</pre></div>

              <div class="nb-body"><pre><span class="py-kw">def</span> <span class="py-fn">clean_retail_data</span>(df: pd.<span class="py-cls">DataFrame</span>) <span class="py-op">-&gt;</span> pd.<span class="py-cls">DataFrame</span>:

function showDetail(id) {
  const project = PROJECTS.find(p => p.id === id);
  if (!project) return;

  const dv = document.getElementById('detail-view');
  const gv = document.getElementById('grid-view');

  dv.innerHTML = `
    <div style="padding-top:2rem">
      <button class="back-btn" onclick="showGrid()">← All Projects</button>
      ${project.buildDetail()}
    </div>
  `;
  dv.classList.add('open');
  gv.style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });

  // Init charts/visualizations after paint
  requestAnimationFrame(() => {
    setTimeout(() => initDetailCharts(id), 50);
    // Animate bars
    document.querySelectorAll('.bar-fill').forEach(el => {
      const w = el.style.width;
      el.style.width = '0';
      setTimeout(() => { el.style.width = w; }, 100);
    });
  });

  // Update URL
  history.replaceState(null, '', `?id=${id}`);
}

function showGrid() {
  document.getElementById('detail-view').classList.remove('open');
  document.getElementById('detail-view').innerHTML = '';
  document.getElementById('grid-view').style.display = 'block';
  history.replaceState(null, '', window.location.pathname);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

  // Deactivate all tabs in the same parent group
  btn.closest('.detail-tabs').querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  // Hide all tab content siblings
  document.querySelectorAll('.tab-content').forEach(tc => {
    if (tc.closest('#detail-view')) tc.classList.remove('active');
  });
  document.getElementById(targetId).classList.add('active');
}

/* ═══════════════════════════════════════════════════════════════════════
   CHART INITIALIZERS
═══════════════════════════════════════════════════════════════════════ */
function initDetailCharts(id) {
  if (id === 'excel-01') initExcelBarChart();
  if (id === 'py-01')    initPyBarChart();
  if (id === 'py-02')    initShapChart();
}

function initExcelBarChart() {
  const container = document.getElementById('xlBarChart');
  const labelsEl  = document.getElementById('xlBarLabels');
  if (!container) return;
  const data = [
    { mo: 'Jan', vals: { NA: 68, EU: 42, APAC: 31, LATAM: 22 } },
    { mo: 'Feb', vals: { NA: 72, EU: 38, APAC: 33, LATAM: 19 } },
    { mo: 'Mar', vals: { NA: 81, EU: 51, APAC: 38, LATAM: 28 } },
  ];
  const colors = { NA: '#fbbf24', EU: '#60a5fa', APAC: '#34d399', LATAM: '#a78bfa' };
  const maxVal = 200;
  container.style.display = 'flex'; container.style.alignItems = 'flex-end'; container.style.gap = '.3rem'; container.style.height = '80px';
  data.forEach(d => {
    const grp = document.createElement('div');
    grp.style.cssText = 'display:flex;align-items:flex-end;gap:2px;flex:1';
    Object.entries(d.vals).forEach(([region, val]) => {
      const col = document.createElement('div');
      const h = (val / maxVal * 80);
      col.style.cssText = `flex:1;height:${h}px;background:${colors[region]};border-radius:2px 2px 0 0;opacity:.85;position:relative;`;
      col.title = `${region}: $${val}K`;
      grp.appendChild(col);
    });
    container.appendChild(grp);
  });
  if (labelsEl) {
    labelsEl.innerHTML = data.map(d => `<div style="flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.48rem;color:var(--dimmed);">${d.mo}</div>`).join('');
  }
}

function initPyBarChart() {
  const el = document.getElementById('pyBarChart');
  if (!el) return;
  const data = [
    { cat: 'Electronics', rev: 6.2, color: '#fbbf24' },
    { cat: 'Home & Living', rev: 4.8, color: '#60a5fa' },
    { cat: 'Clothing', rev: 3.9, color: '#34d399' },
    { cat: 'Sports', rev: 2.4, color: '#a78bfa' },
    { cat: 'Beauty', rev: 1.8, color: '#f87171' },
  ];
  const max = 6.2;
  el.innerHTML = data.map(d => `
    <div style="display:flex;align-items:center;gap:.75rem;">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--muted);width:90px;text-align:right;">${d.cat}</div>
      <div style="flex:1;background:var(--panel2);border-radius:2px;overflow:hidden;">
        <div style="height:14px;width:${(d.rev/max*100)}%;background:${d.color};border-radius:2px;transition:width 1s ease;"></div>
      </div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--cream);width:45px;">$${d.rev}M</div>
    </div>
  `).join('');
}

function initShapChart() {
  const el = document.getElementById('shapChart');
  if (!el) return;
  const features = [
    { name: 'days_since_active', shap: 0.24, color: '#f87171' },
    { name: 'login_trend_30d', shap: 0.21, color: '#fbbf24' },
    { name: 'feature_breadth', shap: 0.16, color: '#34d399' },
    { name: 'tickets_per_seat', shap: 0.14, color: '#60a5fa' },
    { name: 'days_to_renewal', shap: 0.11, color: '#a78bfa' },
    { name: 'contract_value', shap: 0.08, color: '#f9e2af' },
    { name: 'active_seats', shap: 0.06, color: '#89b4fa' },
  ];
  el.innerHTML = `
    <div style="font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--dimmed);margin-bottom:.75rem;">// SHAP Feature Importances — Mean |SHAP value|</div>
    ${features.map(f => `
      <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem;">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--muted);width:160px;text-align:right;">${f.name}</div>
        <div style="flex:1;background:var(--panel2);border-radius:2px;overflow:hidden;">
          <div style="height:12px;width:${f.shap*300}%;background:${f.color};border-radius:2px;opacity:.85;"></div>
        </div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:.58rem;color:var(--cream);width:35px;">${f.shap}</div>
      </div>
    `).join('')}
  `;
}

/* ═══════════════════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════════════════ */
renderGrid('all');

// Check for deep-link ?id=
const urlId = new URLSearchParams(window.location.search).get('id');
if (urlId && PROJECTS.find(p => p.id === urlId)) {
  showDetail(urlId);
}
